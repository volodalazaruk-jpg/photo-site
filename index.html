<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моє фото</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #111827, #1f2937);
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(900px, 100%);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      text-align: center;
      backdrop-filter: blur(10px);
    }
    h1 {
      color: white;
      margin: 8px 0 18px;
      font-size: clamp(24px, 5vw, 40px);
    }
    img {
      display: block;
      width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 16px;
      background: #000;
    }
    p {
      color: #d1d5db;
      margin: 16px 0 4px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Моє фото</h1>
    <img src="photo.jpg" alt="Фото">
    <p>Фото на моєму сайті 📸</p>
  </main>
</body>
</html>
